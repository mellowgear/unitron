[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "unitron"
version = "0.1.0"
description = "Neo Geo Pocket Color (TLCS-900/H) toolchain: asm900-syntax assembler, disassembler, data tools"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
gfx = ["pillow"]

[project.scripts]
unitron = "unitron.cli:main"

[tool.setuptools.packages.find]
include = ["unitron*"]

[tool.setuptools.package-data]
unitron = ["data/*.inc", "lift/*.h"]
