# Build unitron and run its tests on Linux and macOS.
# Every test runs from files in the repo (our own test cartridge included); the optional tests
# that check commercial ROMs by hash skip themselves when no ROM is given.
name: CI
on:
  - push
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CTEST_OUTPUT_ON_FAILURE: ON
  CTEST_NO_TESTS_ACTION: error

defaults:
  run:
    shell: bash

jobs:
  unix:
    strategy:
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15-intel, macos-26]
        cxx: [g++, clang++]
        exclude: # g++ on macOS is an alias for clang++
          - { os: macos-15-intel, cxx: g++ }
          - { os: macos-26, cxx: g++ }
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Configure
        # The libpng download (SourceForge) sometimes fails its TLS check; one retry.
        run: |
          CXX=${{ matrix.cxx }} cmake -S . -B build || CXX=${{ matrix.cxx }} cmake -S . -B build
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build
      - name: Install
        run: |
          cmake --install build --prefix "$PWD/dist"
          dist/bin/unitron --help > /dev/null
      - uses: actions/upload-artifact@v7
        with:
          name: unitron-${{ matrix.os }}-${{ matrix.cxx }}
          path: dist/bin
          if-no-files-found: error

